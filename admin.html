<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ASH Chatting – Espace recruteur</title>
<style>
/* ASH Chatting - thème bleu marine & bleu ciel */
:root{
  --navy:#0b1f4b; --navy2:#12306b; --sky:#38a9f5; --sky-soft:#e8f4fe; --sky-line:#cfe6fa;
  --bg:#f3f7fc; --card:#ffffff; --line:#dbe5f1;
  --text:#14213d; --muted:#64748b;
  --shadow:0 4px 18px rgba(11,31,75,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.55}
a{color:var(--sky);font-weight:600}
.wrap{max-width:1200px;margin:0 auto;padding:28px 16px}
.narrow{max-width:800px}

/* En-tête */
header.top{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px rgba(11,31,75,.25)}
header.top .muted{color:#b9d4f5;font-size:.85rem}
header.top .ghost{border-color:rgba(255,255,255,.35);color:#fff}
header.top .ghost:hover{background:rgba(255,255,255,.12)}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:.6px;color:#fff}
.logo span{color:var(--sky)}

/* Cartes */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;margin-bottom:20px;box-shadow:var(--shadow)}
h1{font-size:1.45rem;margin-bottom:6px;color:var(--navy)}
.muted{color:var(--muted);font-size:.92rem}
.center{text-align:center}

/* Formulaires */
label{display:block;font-size:.82rem;font-weight:600;color:var(--navy2);margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 13px;background:#fff;color:var(--text);border:1.5px solid var(--line);border-radius:10px;font-size:.95rem;font-family:inherit;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px rgba(56,169,245,.18)}
textarea{min-height:110px;resize:vertical}
@media(max-width:640px){header.top{padding:12px 14px}}

/* Boutons */
button{background:linear-gradient(135deg,var(--sky),#1f8fe0);color:#fff;border:0;padding:11px 20px;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
button:hover{filter:brightness(1.07);transform:translateY(-1px)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
button.ghost{background:transparent;border:1.5px solid var(--line);color:var(--navy)}
button.ghost:hover{background:var(--sky-soft)}
button.danger{background:linear-gradient(135deg,#ef4444,#dc2626)}
button.full{width:100%;margin-top:20px;padding:13px}

/* Messages */
.msg{padding:11px 14px;border-radius:10px;margin-top:14px;font-size:.9rem;display:none}
.msg.err{display:block;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.msg.ok{display:block;background:var(--sky-soft);color:var(--navy2);border:1px solid var(--sky-line)}

/* Badges */
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:700;white-space:nowrap}
.b-nouveau{background:#e0f0ff;color:#1366b3}
.b-en_revue{background:#fff4d6;color:#a16207}
.b-entretien{background:#e6e0ff;color:#5b3fc9}
.b-accepte{background:#dcfce7;color:#15803d}
.b-refuse{background:#fee2e2;color:#b91c1c}
.tag{display:inline-block;padding:2px 9px;border-radius:8px;font-size:.78rem;font-weight:600;background:var(--sky-soft);color:var(--navy2)}

/* Statistiques */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--sky);border-radius:14px;padding:16px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.stat:hover{transform:translateY(-2px)}
.stat b{display:block;font-size:1.7rem;color:var(--navy)}
.stat span{color:var(--muted);font-size:.8rem;font-weight:600}
.stat.active{border-top-color:var(--navy);outline:2px solid var(--sky)}

/* Tableau */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar input{flex:2;min-width:180px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.count{font-size:.85rem;color:var(--muted);margin-bottom:10px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--navy2);font-weight:700;font-size:.76rem;text-transform:uppercase;letter-spacing:.4px;background:var(--sky-soft);white-space:nowrap}
tr.row{cursor:pointer;transition:.12s}
tr.row:hover{background:var(--sky-soft)}
.tablewrap{overflow-x:auto}

/* Fenêtre détail */
.modal-bg{position:fixed;inset:0;background:rgba(11,31,75,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto;z-index:20}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:740px;box-shadow:0 20px 50px rgba(11,31,75,.3)}
.kv{display:grid;grid-template-columns:170px 1fr;gap:10px 14px;font-size:.92rem;margin:16px 0;padding:16px;background:var(--bg);border-radius:12px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{word-break:break-word;white-space:pre-wrap}
@media(max-width:560px){.kv{grid-template-columns:1fr}}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

/* Connexion */
.hero{text-align:center;padding:36px 0 22px}
.hero p{color:var(--muted);margin-top:6px}

/* Langue */
.head-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.lang-select{width:auto;padding:7px 10px;font-size:.85rem;border-radius:8px;cursor:pointer;font-weight:600}
header.top .lang-select{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
header.top .lang-select option{color:#14213d}
.lang-float{position:absolute;top:16px;right:16px}
</style>

<script>
// ====== Connexion Supabase (clé "publishable" : elle peut être publique) ======
const SUPABASE_URL = 'https://exzrbektcftpsanysclz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_oQxEq_c9GYWmAvJj-iAV3w_gfFQWt7M';
const sb = (window.supabase && window.supabase.createClient)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

// Protège contre l'injection de code dans les textes saisis par les candidats
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Profil du recruteur connecté (null si personne n'est connecté)
async function getProfile() {
  if (!sb) return null;
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return null;
    const { data } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
    return data ? { ...data, email: data.email || session.user.email, user: session.user } : null;
  } catch (e) {
    return null;
  }
}
</script>

const STATUT_KEYS = ['nouveau', 'en_revue', 'entretien', 'accepte', 'refuse'];

let LANG = 'fr';
try {
  const saved = localStorage.getItem('ash_lang');
  LANG = saved || ((navigator.language || 'fr').slice(0, 2));
} catch (e) {}
if (!I18N[LANG]) LANG = 'fr';

function t(key) { return (I18N[LANG] && I18N[LANG][key]) ?? I18N.fr[key] ?? key; }
function tv(value) {            // traduit une valeur stockée en base (ex : "Homme" -> "Man")
  if (!value) return '';
  return (I18N[LANG] && I18N[LANG]['v.' + value]) ?? value;
}
function statut(k) { return t('st.' + k); }
function locale() { return LANG === 'fr' ? 'fr-FR' : 'en-GB'; }

function applyI18n() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('.lang-select').forEach(s => { s.value = LANG; });
  if (document.body && document.body.dataset.title) document.title = t(document.body.dataset.title);
}
function setLang(l) {
  if (!I18N[l]) return;
  LANG = l;
  try { localStorage.setItem('ash_lang', l); } catch (e) {}
  applyI18n();
  document.dispatchEvent(new Event('langchange'));
}

<script>
let apps = [];
let current = null;
let pollTimer = null;
const HAS_SB = (typeof sb !== 'undefined' && sb);
const $ = id => document.getElementById(id);

const SORTS = [
  ['recent', 'ad.sort.recent'], ['old', 'ad.sort.old'], ['name', 'ad.sort.name'],
  ['ageAsc', 'ad.sort.ageAsc'], ['ageDesc', 'ad.sort.ageDesc'], ['status', 'ad.sort.status']
];

const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const fmtDate = d => d ? new Date(d).toLocaleString(locale()) : '';

// Contact : lien WhatsApp cliquable si le candidat a choisi WhatsApp
function contactHtml(a) {
  const val = esc(a.contact_value);
  if (a.contact_type === 'WhatsApp') {
    const digits = String(a.contact_value || '').replace(/\D/g, '');
    if (digits.length >= 6) {
      return `<span class="tag">WhatsApp</span><br><a href="https://wa.me/${digits}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${val}</a>`;
    }
  }
  return `<span class="tag">${esc(tv(a.contact_type))}</span><br>${val}`;
}

// Remplit un <select> en gardant la valeur déjà choisie
function fill(id, allLabel, pairs) {
  const sel = $(id);
  const keep = sel.value;
  let html = allLabel ? `<option value="">${esc(allLabel)}</option>` : '';
  html += pairs.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
  sel.innerHTML = html;
  sel.value = keep;
}

function fillAll() {
  fill('filterStatus', t('ad.allStatus'), STATUT_KEYS.map(k => [k, statut(k)]));
  fill('filterGender', t('ad.allGender'), ['Homme', 'Femme'].map(v => [v, tv(v)]));
  fill('filterShift', t('ad.allShift'), ['Jour', 'Soir', 'Nuit', 'Flexible'].map(v => [v, tv(v)]));
  fill('filterMode', t('ad.allMode'), ['Local', 'En ligne'].map(v => [v, tv(v)]));
  fill('filterJob', t('ad.allJob'), [['Oui', t('ad.jobYes')], ['Non', t('ad.jobNo')]]);
  fill('sortBy', null, SORTS.map(([v, k]) => [v, t(k)]));
  fill('mStatus', null, STATUT_KEYS.map(k => [k, statut(k)]));
}

/* ---------- Connexion ---------- */
async function init() {
  applyI18n();
  fillAll();
  if (!HAS_SB) { showLogin('err.noConfig'); return; }
  const p = await getProfile();
  if (p && p.role === 'admin') { showDash(p); return; }
  if (p) { await sb.auth.signOut(); showLogin('lg.denied'); return; }
  showLogin();
}

let lgKey = null;
function showLogin(msgKey) {
  stopPolling();
  $('dashView').style.display = 'none';
  $('loginView').style.display = 'block';
  lgKey = msgKey || null;
  const el = $('lgMsg');
  el.textContent = lgKey ? t(lgKey) : '';
  el.className = 'msg' + (lgKey ? ' err' : '');
}

function showDash(p) {
  $('loginView').style.display = 'none';
  $('dashView').style.display = 'block';
  $('who').textContent = p.email || (p.user && p.user.email) || '';
  load();
  startPolling();
}

async function adminLogin(e) {
  e.preventDefault();
  if (!HAS_SB) { showLogin('err.noConfig'); return; }
  const btn = $('lgBtn');
  btn.disabled = true;
  try {
    const { error } = await sb.auth.signInWithPassword({
      email: $('lgEmail').value.trim(),
      password: $('lgPass').value
    });
    if (error) {
      showLogin('idx.badLogin');
    } else {
      const p = await getProfile();
      if (p && p.role === 'admin') { $('lgPass').value = ''; showDash(p); }
      else { await sb.auth.signOut(); showLogin('lg.denied'); }
    }
  } catch (err) {
    showLogin('err.noConfig');
  }
  btn.disabled = false;
}

async function adminLogout() {
  await sb.auth.signOut();
  apps = [];
  closeModal();
  showLogin();
}

/* ---------- Données ---------- */
// Actualisation automatique toutes les 30 s (sauf si une fiche est ouverte)
function startPolling() {
  stopPolling();
  pollTimer = setInterval(() => {
    if (!current && $('dashView').style.display !== 'none') load(true);
  }, 30000);
}
function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

async function load(silent) {
  const { data, error } = await sb.from('applications').select('*').order('created_at', { ascending: false });
  if (error) { if (!silent) alert(t('ad.loadError') + error.message); return; }
  apps = data || [];
  render();
}

function resetFilters() {
  $('search').value = '';
  ['filterStatus', 'filterGender', 'filterShift', 'filterMode', 'filterJob'].forEach(id => $(id).value = '');
  $('sortBy').value = 'recent';
  render();
}

function filterByStatus(k) { $('filterStatus').value = k; render(); }

function getList() {
  const q = norm($('search').value);
  const st = $('filterStatus').value;
  const g = $('filterGender').value;
  const sh = $('filterShift').value;
  const md = $('filterMode').value;
  const jb = $('filterJob').value;
  const sort = $('sortBy').value || 'recent';

  const list = apps.filter(a =>
    (!st || a.status === st) && (!g || a.gender === g) && (!sh || a.shift === sh) &&
    (!md || a.work_mode === md) && (!jb || a.current_job === jb) &&
    (!q || norm([a.full_name, a.discord, a.contact_value, a.studies, a.experience, a.motivation].join(' ')).includes(q))
  );

  const cmp = {
    recent: (a, b) => new Date(b.created_at) - new Date(a.created_at),
    old: (a, b) => new Date(a.created_at) - new Date(b.created_at),
    name: (a, b) => norm(a.full_name).localeCompare(norm(b.full_name)),
    ageAsc: (a, b) => (a.age ?? 999) - (b.age ?? 999),
    ageDesc: (a, b) => (b.age ?? -1) - (a.age ?? -1),
    status: (a, b) => STATUT_KEYS.indexOf(a.status) - STATUT_KEYS.indexOf(b.status)
  }[sort];
  return list.sort(cmp);
}

function renderStats() {
  const active = $('filterStatus').value;
  let html = `<div class="stat ${active === '' ? 'active' : ''}" onclick="filterByStatus('')"><b>${apps.length}</b><span>${esc(t('ad.total'))}</span></div>`;
  STATUT_KEYS.forEach(k => {
    const n = apps.filter(a => a.status === k).length;
    html += `<div class="stat ${active === k ? 'active' : ''}" onclick="filterByStatus('${k}')"><b>${n}</b><span>${esc(statut(k))}</span></div>`;
  });
  $('stats').innerHTML = html;
}

function render() {
  const list = getList();
  renderStats();
  $('count').textContent = t('ad.results').replace('{n}', list.length).replace('{total}', apps.length);
  $('empty').style.display = list.length ? 'none' : 'block';
  $('rows').innerHTML = list.map(a => `
    <tr class="row" onclick="openApp('${esc(a.id)}')">
      <td>${esc(fmtDate(a.created_at))}</td>
      <td><b>${esc(a.full_name)}</b></td>
      <td>${esc(tv(a.gender))}</td>
      <td>${esc(a.age)}</td>
      <td>${contactHtml(a)}</td>
      <td>${esc(a.discord)}</td>
      <td>${esc(tv(a.current_job))}</td>
      <td>${esc(tv(a.shift))}</td>
      <td>${esc(tv(a.work_mode))}</td>
      <td><span class="badge b-${esc(a.status)}">${esc(statut(a.status))}</span></td>
    </tr>`).join('');
}

/* ---------- Fiche détail ---------- */
function renderDetails() {
  if (!current) return;
  const a = current;
  const rows = [
    ['created_at', esc(fmtDate(a.created_at))],
    ['gender', esc(tv(a.gender))],
    ['full_name', esc(a.full_name)],
    ['age', esc(a.age)],
    ['contact', contactHtml(a).replace('<br>', ' ')],
    ['discord', esc(a.discord)],
    ['studies', esc(a.studies)],
    ['current_job', esc(tv(a.current_job))],
    ['experience', esc(a.experience)],
    ['shift', esc(tv(a.shift))],
    ['work_mode', esc(tv(a.work_mode))],
    ['motivation', esc(a.motivation)]
  ];
  $('mDetails').innerHTML = rows.map(([k, v]) => `<dt>${esc(t('lb.' + k))}</dt><dd>${v || '—'}</dd>`).join('');
}

async function openApp(id) {
  current = apps.find(a => String(a.id) === String(id));
  if (!current) return;
  $('mName').textContent = current.full_name || '';
  renderDetails();
  $('mStatus').value = current.status;
  $('mNotes').value = current.admin_notes || '';
  $('mMsg').className = 'msg';
  $('modalBg').classList.add('open');

  // Passe automatiquement "nouveau" -> "en revue" à l'ouverture
  if (current.status === 'nouveau') {
    const target = current;
    const { error } = await sb.from('applications').update({ status: 'en_revue' }).eq('id', target.id);
    if (!error) {
      target.status = 'en_revue';
      if (current === target) $('mStatus').value = 'en_revue';
      render();
    }
  }
}

function closeModal() {
  $('modalBg').classList.remove('open');
  current = null;
}

async function saveReview() {
  if (!current) return;
  const msg = $('mMsg');
  const status = $('mStatus').value;
  const admin_notes = $('mNotes').value.trim() || null;
  const { error } = await sb.from('applications').update({ status, admin_notes }).eq('id', current.id);
  if (error) { msg.textContent = error.message; msg.className = 'msg err'; return; }
  current.status = status;
  current.admin_notes = admin_notes;
  render();
  msg.textContent = t('ad.saved');
  msg.className = 'msg ok';
}

async function removeApp() {
  if (!current) return;
  if (!confirm(t('ad.confirmDelete'))) return;
  const { error } = await sb.from('applications').delete().eq('id', current.id);
  if (error) { alert(error.message); return; }
  closeModal();
  load();
}

/* ---------- Export CSV ---------- */
function exportCsv() {
  const cols = ['created_at','gender','full_name','age','contact_type','contact_value','discord','studies','current_job','experience','shift','work_mode','motivation','status','admin_notes'];
  // Protège aussi contre l'injection de formules dans Excel (cellules commençant par = + - @)
  const q = v => {
    let s = String(v ?? '');
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
    return '"' + s.replace(/"/g, '""') + '"';
  };
  const rows = getList(); // exporte ce qui est affiché (filtres appliqués)
  const csv = [cols.join(',')].concat(rows.map(a => cols.map(c => q(a[c])).join(','))).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'candidatures-ash-chatting.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

document.addEventListener('langchange', () => {
  if (lgKey) showLogin(lgKey);
  fillAll();
  render();
  renderDetails();
});

// Si quoi que ce soit échoue au démarrage, on affiche quand même la connexion (jamais de page vide)
init().catch(() => showLogin('err.noConfig'));
</script>
