<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASH Chatting – Espace recruteur</title>
<style>
/* ASH Chatting - thème bleu marine & bleu ciel */
:root{
  --navy:#0b1f4b; --navy2:#12306b; --sky:#38a9f5; --sky-soft:#e8f4fe; --sky-line:#cfe6fa;
  --bg:#f3f7fc; --card:#ffffff; --line:#dbe5f1;
  --text:#14213d; --muted:#64748b;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --shadow:0 4px 18px rgba(11,31,75,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.55}
a{color:var(--sky);font-weight:600}
.wrap{max-width:1100px;margin:0 auto;padding:28px 16px}
.narrow{max-width:800px}

/* En-tête */
header.top{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px rgba(11,31,75,.25)}
header.top .muted{color:#b9d4f5;font-size:.85rem}
header.top .logo{color:#fff}
header.top .ghost{border-color:rgba(255,255,255,.35);color:#fff}
header.top .ghost:hover{background:rgba(255,255,255,.12)}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:.6px;color:var(--navy)}
.logo span{color:var(--sky)}

/* Cartes */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;margin-bottom:20px;box-shadow:var(--shadow)}
h1{font-size:1.55rem;margin-bottom:6px;color:var(--navy)}
h2{font-size:1.05rem;margin-bottom:12px;color:var(--navy);padding-bottom:8px;border-bottom:2px solid var(--sky-soft);display:flex;align-items:center;gap:8px}
h2::before{content:'';width:5px;height:18px;background:var(--sky);border-radius:3px}
.muted{color:var(--muted);font-size:.92rem}

/* Formulaires */
label{display:block;font-size:.82rem;font-weight:600;color:var(--navy2);margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 13px;background:#fff;color:var(--text);border:1.5px solid var(--line);border-radius:10px;font-size:.95rem;font-family:inherit;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px rgba(56,169,245,.18)}
input:disabled,select:disabled,textarea:disabled{background:#eef3f9;color:#7b8aa0;cursor:not-allowed}
input[type=file]{padding:9px;background:var(--sky-soft);border-style:dashed;border-color:var(--sky)}
textarea{min-height:110px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media(max-width:640px){.grid{grid-template-columns:1fr}header.top{padding:12px 14px}}

/* Boutons */
button,.btn{background:linear-gradient(135deg,var(--sky),#1f8fe0);color:#fff;border:0;padding:11px 20px;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
button:hover{filter:brightness(1.07);transform:translateY(-1px)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
button.ghost{background:transparent;border:1.5px solid var(--line);color:var(--navy);box-shadow:none}
button.ghost:hover{background:var(--sky-soft)}
button.danger{background:linear-gradient(135deg,#ef4444,#dc2626)}
button.full{width:100%;margin-top:20px;padding:13px}

/* Onglets connexion */
.tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--sky-soft);padding:5px;border-radius:12px}
.tabs button{flex:1;background:transparent;color:var(--navy2);box-shadow:none}
.tabs button.active{background:var(--navy);color:#fff}

/* Messages */
.msg{padding:11px 14px;border-radius:10px;margin-top:14px;font-size:.9rem;display:none}
.msg.err{display:block;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.msg.ok{display:block;background:var(--sky-soft);color:var(--navy2);border:1px solid var(--sky-line)}

/* Badges statut */
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:700}
.b-nouveau{background:#e0f0ff;color:#1366b3}
.b-en_revue{background:#fff4d6;color:#a16207}
.b-entretien{background:#e6e0ff;color:#5b3fc9}
.b-accepte{background:#dcfce7;color:#15803d}
.b-refuse{background:#fee2e2;color:#b91c1c}

/* Statistiques admin */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--sky);border-radius:14px;padding:16px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.7rem;color:var(--navy)}
.stat span{color:var(--muted);font-size:.8rem;font-weight:600}

/* Tableau admin */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar input{flex:2;min-width:180px}
.toolbar select{flex:1;min-width:140px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:12px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--navy2);font-weight:700;font-size:.76rem;text-transform:uppercase;letter-spacing:.4px;background:var(--sky-soft)}
tr.row{cursor:pointer;transition:.12s}
tr.row:hover{background:var(--sky-soft)}
.tablewrap{overflow-x:auto}

/* Fenêtre détail */
.modal-bg{position:fixed;inset:0;background:rgba(11,31,75,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto;z-index:20}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:16px;padding:26px;width:100%;max-width:720px;box-shadow:0 20px 50px rgba(11,31,75,.3)}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;font-size:.92rem;margin:16px 0;padding:16px;background:var(--bg);border-radius:12px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{word-break:break-word;white-space:pre-wrap}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.center{text-align:center}

/* Page de connexion */
.hero{text-align:center;padding:36px 0 22px}
.hero p{color:var(--muted);margin-top:6px}
.hero .logo{font-size:2.2rem}


/* Sélecteur de langue + filtres */
.head-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.lang-select{width:auto;padding:7px 10px;font-size:.85rem;border-radius:8px;cursor:pointer;font-weight:600}
header.top .lang-select{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
header.top .lang-select option{color:#14213d}
.lang-float{position:absolute;top:16px;right:16px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.count{font-size:.85rem;color:var(--muted);margin-bottom:10px;font-weight:600}
.stat.clickable{cursor:pointer;transition:.15s}
.stat.clickable:hover{transform:translateY(-2px)}
.stat.active{border-top-color:var(--navy);outline:2px solid var(--sky)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}

const STATUT_KEYS = ['nouveau', 'en_revue', 'entretien', 'accepte', 'refuse'];

let LANG = 'fr';
try {
  const saved = localStorage.getItem('ash_lang');
  LANG = saved || ((navigator.language || 'fr').slice(0, 2));
} catch (e) {}
if (!I18N[LANG]) LANG = 'fr';

function t(key) {
  return (I18N[LANG] && I18N[LANG][key]) ?? I18N.fr[key] ?? key;
}
// Traduit une valeur stockée en base (ex : "Homme" -> "Man")
function tv(value) {
  if (!value) return '';
  const k = 'v.' + value;
  return (I18N[LANG] && I18N[LANG][k]) ?? value;
}
function statut(k) { return t('st.' + k); }
function locale() { return LANG === 'fr' ? 'fr-FR' : 'en-GB'; }

function applyI18n() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('.lang-select').forEach(s => { s.value = LANG; });
  if (document.body && document.body.dataset.title) document.title = t(document.body.dataset.title);
}

function setLang(l) {
  if (!I18N[l]) return;
  LANG = l;
  try { localStorage.setItem('ash_lang', l); } catch (e) {}
  applyI18n();
  document.dispatchEvent(new Event('langchange'));
}

<body data-title="title.admin">
<div id="loginView" style="display:none">
  <select class="lang-select lang-float" onchange="setLang(this.value)" aria-label="Language" style="background:#fff;color:#0b1f4b;border-color:#dbe5f1">
    <option value="fr">FR – Français</option>
    <option value="en">EN – English</option>

  <div class="wrap narrow">
    <div class="hero">
      <div class="logo" style="font-size:2rem">ASH <span>Chatting</span></div>
      <p style="font-weight:700;color:#0b1f4b;margin-top:10px" data-i18n="lg.title"></p>
      <p data-i18n="lg.subtitle"></p>
    </div>
    <div class="card" style="max-width:440px;margin:0 auto">
      <form onsubmit="adminLogin(event)">
        <label data-i18n="idx.email"></label>
        <input id="lgEmail" type="email" required>
        <label data-i18n="idx.password"></label>
        <input id="lgPass" type="password" required>
        <button class="full" id="lgBtn" data-i18n="idx.btnLogin"></button>
        <div id="lgMsg" class="msg"></div>

    </div>
  </div>
</div>

  <div class="card">
    <div class="toolbar">
      <input id="search" data-i18n-ph="ph.search" oninput="render()">
      <button class="ghost" onclick="resetFilters()" data-i18n="ad.reset"></button>
      <button class="ghost" onclick="exportCsv()" data-i18n="ad.export"></button>
      <button class="ghost" onclick="load()" data-i18n="ad.refresh"></button>
    </div>
    <div class="filters">
      <select id="filterStatus" onchange="render()"></select>
      <select id="filterGender" onchange="render()"></select>
      <select id="filterShift" onchange="render()"></select>
      <select id="filterMode" onchange="render()"></select>
      <select id="filterJob" onchange="render()"></select>
      <select id="filterLang" onchange="render()"></select>
      <select id="sortBy" onchange="render()"></select>
    </div>
    <p class="count" id="count"></p>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th data-i18n="th.candidate"></th><th data-i18n="th.gender"></th><th data-i18n="th.age"></th>
          <th data-i18n="th.contact"></th><th data-i18n="th.shift"></th><th data-i18n="th.mode"></th>
          <th data-i18n="th.status"></th><th data-i18n="th.timestamp"></th><th data-i18n="th.lang"></th>
        </tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="muted center" id="empty" style="display:none;padding:20px" data-i18n="ad.empty"></p>
  </div>
</div>

<!-- Fiche détail -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h1 id="mName"></h1>
      <button class="ghost" onclick="closeModal()">✕</button>
    </div>
    <dl class="kv" id="mDetails"></dl>

    <label data-i18n="ad.statusLabel"></label>
    <select id="mStatus"></select>
    <label data-i18n="ad.notes"></label>
    <textarea id="mNotes"></textarea>

    <div class="row-actions">
      <button onclick="saveReview()" data-i18n="ad.save"></button>
      <button class="danger" onclick="removeApp()" data-i18n="ad.delete"></button>
    </div>
    <div id="mMsg" class="msg"></div>
  </div>
</div>

</div>

<script>
let apps = [];
let current = null;

const LABEL_KEYS = ['created_at','email','gender','age','contact_type','contact_value','discord','studies','current_job','job_details','shift','work_mode','experience','motivation','site_lang'];
const SORTS = [
  ['recent', 'ad.sort.recent'], ['old', 'ad.sort.old'], ['name', 'ad.sort.name'],
  ['ageAsc', 'ad.sort.ageAsc'], ['ageDesc', 'ad.sort.ageDesc'], ['status', 'ad.sort.status']
];

const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const fmtDate = d => d ? new Date(d).toLocaleString(locale()) : '';

// Remplit un <select> en gardant la valeur déjà choisie
function fill(id, allLabel, pairs) {
  const sel = document.getElementById(id);
  const keep = sel.value;
  let html = allLabel ? `<option value="">${esc(allLabel)}</option>` : '';
  html += pairs.map(([v, l]) => `<option value="${esc(v)}">${esc(l)}</option>`).join('');
  sel.innerHTML = html;
  sel.value = keep;
}

function fillAll() {
  fill('filterStatus', t('ad.allStatus'), STATUT_KEYS.map(k => [k, statut(k)]));
  fill('filterGender', t('ad.allGender'), ['Homme', 'Femme'].map(v => [v, tv(v)]));
  fill('filterShift', t('ad.allShift'), ['Jour', 'Soir', 'Nuit', 'Flexible'].map(v => [v, tv(v)]));
  fill('filterMode', t('ad.allMode'), ['Local', 'En ligne'].map(v => [v, tv(v)]));
  fill('filterJob', t('ad.allJob'), [['Oui', t('ad.jobYes')], ['Non', t('ad.jobNo')]]);
  fill('filterLang', t('ad.allLang'), ['fr', 'en'].map(v => [v, tv(v)]));
  fill('sortBy', null, SORTS.map(([v, k]) => [v, t(k)]));
  fill('mStatus', null, STATUT_KEYS.map(k => [k, statut(k)]));
}

async function init() {
  applyI18n();
  fillAll();
  const p = await getProfile();
  if (p && p.role === 'admin') { showDash(p); return; }
  if (p) { await sb.auth.signOut(); showLogin('lg.denied'); return; }
  showLogin();
}

let lgKey = null;
function showLogin(msgKey) {
  document.getElementById('dashView').style.display = 'none';
  document.getElementById('loginView').style.display = 'block';
  lgKey = msgKey || null;
  const el = document.getElementById('lgMsg');
  el.textContent = lgKey ? t(lgKey) : '';
  el.className = 'msg' + (lgKey ? ' err' : '');
}

function showDash(p) {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('dashView').style.display = 'block';
  document.getElementById('who').textContent = p.email;
  load();
}

async function adminLogin(e) {
  e.preventDefault();
  const btn = document.getElementById('lgBtn');
  btn.disabled = true;
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById('lgEmail').value.trim(),
    password: document.getElementById('lgPass').value
  });
  if (error) {
    showLogin('idx.badLogin');
  } else {
    const p = await getProfile();
    if (p && p.role === 'admin') {
      document.getElementById('lgPass').value = '';
      showDash(p);
    } else {
      await sb.auth.signOut();
      showLogin('lg.denied');
    }
  }
  btn.disabled = false;
}

async function adminLogout() {
  await sb.auth.signOut();
  apps = [];
  showLogin();
}

async function load() {
  const { data, error } = await sb.from('applications').select('*').order('created_at', { ascending: false });
  if (error) { alert(error.message); return; }
  apps = data;
  render();
}

function resetFilters() {
  document.getElementById('search').value = '';
  ['filterStatus', 'filterGender', 'filterShift', 'filterMode', 'filterJob', 'filterLang'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('sortBy').value = 'recent';
  render();
}

function filterByStatus(k) {
  document.getElementById('filterStatus').value = k;
  render();
}

function getList() {
  const q = norm(document.getElementById('search').value);
  const st = document.getElementById('filterStatus').value;
  const g = document.getElementById('filterGender').value;
  const sh = document.getElementById('filterShift').value;
  const md = document.getElementById('filterMode').value;
  const jb = document.getElementById('filterJob').value;
  const lg = document.getElementById('filterLang').value;
  const sort = document.getElementById('sortBy').value || 'recent';

  const list = apps.filter(a =>
    (!st || a.status === st) && (!g || a.gender === g) && (!sh || a.shift === sh) &&
    (!md || a.work_mode === md) && (!jb || a.current_job === jb) && (!lg || a.site_lang === lg) &&
    (!q || norm([a.full_name, a.email, a.discord, a.contact_value, a.studies, a.job_details, a.experience].join(' ')).includes(q))
  );

  const cmp = {
    recent: (a, b) => new Date(b.created_at) - new Date(a.created_at),
    old: (a, b) => new Date(a.created_at) - new Date(b.created_at),
    name: (a, b) => norm(a.full_name).localeCompare(norm(b.full_name)),
    ageAsc: (a, b) => (a.age ?? 999) - (b.age ?? 999),
    ageDesc: (a, b) => (b.age ?? -1) - (a.age ?? -1),
    status: (a, b) => STATUT_KEYS.indexOf(a.status) - STATUT_KEYS.indexOf(b.status)
  }[sort];
  return list.sort(cmp);
}

function renderStats() {
  const active = document.getElementById('filterStatus').value;
  let html = `<div class="stat clickable ${active === '' ? 'active' : ''}" onclick="filterByStatus('')"><b>${apps.length}</b><span>${esc(t('ad.total'))}</span></div>`;
  STATUT_KEYS.forEach(k => {
    const n = apps.filter(a => a.status === k).length;
    html += `<div class="stat clickable ${active === k ? 'active' : ''}" onclick="filterByStatus('${k}')"><b>${n}</b><span>${esc(statut(k))}</span></div>`;
  });
  document.getElementById('stats').innerHTML = html;
}

function render() {
  const list = getList();
  renderStats();
  document.getElementById('count').textContent = t('ad.results').replace('{n}', list.length).replace('{total}', apps.length);
  document.getElementById('empty').style.display = list.length ? 'none' : 'block';
  document.getElementById('rows').innerHTML = list.map(a => `
    <tr class="row" onclick="openApp('${esc(a.id)}')">
      <td><b>${esc(a.full_name)}</b><br><span class="muted">${esc(a.discord)}</span></td>
      <td>${esc(tv(a.gender))}</td>
      <td>${esc(a.age)}</td>
      <td>${esc(tv(a.contact_type))}<br><span class="muted">${esc(a.contact_value)}</span></td>
      <td>${esc(tv(a.shift))}</td>
      <td>${esc(tv(a.work_mode))}</td>
      <td><span class="badge b-${esc(a.status)}">${esc(statut(a.status))}</span></td>
      <td>${esc(fmtDate(a.created_at))}</td>
      <td>${esc(tv(a.site_lang))}</td>
    </tr>`).join('');
}

function renderDetails() {
  if (!current) return;
  document.getElementById('mDetails').innerHTML = LABEL_KEYS.map(k => {
    let val = current[k];
    if (k === 'created_at') val = fmtDate(val);
    else if (['gender', 'contact_type', 'current_job', 'shift', 'work_mode', 'site_lang'].includes(k)) val = tv(val);
    return `<dt>${esc(t('lb.' + k))}</dt><dd>${esc(val) || '—'}</dd>`;
  }).join('');
}

async function openApp(id) {
  current = apps.find(a => a.id === id);
  if (!current) return;
  document.getElementById('mName').textContent = current.full_name;
  renderDetails();
  document.getElementById('mStatus').value = current.status;
  document.getElementById('mNotes').value = current.admin_notes || '';
  document.getElementById('mMsg').className = 'msg';
  document.getElementById('modalBg').classList.add('open');

  // Passe automatiquement "nouveau" -> "en revue" à l'ouverture
  if (current.status === 'nouveau') {
    const { error } = await sb.from('applications').update({ status: 'en_revue' }).eq('id', current.id);
    if (!error) {
      current.status = 'en_revue';
      document.getElementById('mStatus').value = 'en_revue';
      render();
    }
  }
}

function closeModal() {
  document.getElementById('modalBg').classList.remove('open');
  current = null;
}

async function saveReview() {
  const msg = document.getElementById('mMsg');
  const status = document.getElementById('mStatus').value;
  const admin_notes = document.getElementById('mNotes').value.trim() || null;
  const { error } = await sb.from('applications').update({ status, admin_notes }).eq('id', current.id);
  if (error) { msg.textContent = error.message; msg.className = 'msg err'; return; }
  current.status = status;
  current.admin_notes = admin_notes;
  render();
  msg.textContent = t('ad.saved');
  msg.className = 'msg ok';
}

async function removeApp() {
  if (!confirm(t('ad.confirmDelete'))) return;
  const { error } = await sb.from('applications').delete().eq('id', current.id);
  if (error) { alert(error.message); return; }
  closeModal();
  load();
}

function exportCsv() {
  const cols = ['created_at','gender','full_name','age','contact_type','contact_value','discord','studies','current_job','job_details','experience','shift','work_mode','motivation','site_lang','status','admin_notes'];
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = getList(); // exporte ce qui est affiché (filtres appliqués)
  const csv = [cols.join(',')].concat(rows.map(a => cols.map(c => q(a[c])).join(','))).join('\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'candidatures-ash-chatting.csv';
  a.click();
}

document.addEventListener('langchange', () => {
  if (lgKey) showLogin(lgKey);
  fillAll();
  render();
  renderDetails();
});

init();
</script>
</body>
</html>
