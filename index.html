<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASH Chatting – Candidature</title>
<style>
/* ASH Chatting - thème bleu marine & bleu ciel */
:root{
  --navy:#0b1f4b; --navy2:#12306b; --sky:#38a9f5; --sky-soft:#e8f4fe; --sky-line:#cfe6fa;
  --bg:#f3f7fc; --card:#ffffff; --line:#dbe5f1;
  --text:#14213d; --muted:#64748b;
  --shadow:0 4px 18px rgba(11,31,75,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.55}
a{color:var(--sky);font-weight:600}
.wrap{max-width:800px;margin:0 auto;padding:28px 16px 60px}
[hidden]{display:none !important}

/* En-tête */
header.top{display:flex;justify-content:space-between;align-items:center;gap:8px 10px;flex-wrap:wrap;padding:14px 28px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px rgba(11,31,75,.25)}
header.top .logo{color:#fff}
header.top .ghost{border-color:rgba(255,255,255,.35);color:#fff;padding:8px 14px;font-size:.85rem}
header.top .ghost:hover{background:rgba(255,255,255,.12)}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:.6px;color:var(--navy);white-space:nowrap}
.logo span{color:var(--sky)}
.head-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.lang-select{width:auto;padding:7px 10px;font-size:.85rem;border-radius:8px;cursor:pointer;font-weight:600;background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.35)}
.lang-select option{color:#14213d}

/* Cartes */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;margin-bottom:20px;box-shadow:var(--shadow)}
h1{font-size:1.55rem;margin-bottom:6px;color:var(--navy)}
h2{font-size:1.05rem;margin-bottom:12px;color:var(--navy);padding-bottom:8px;border-bottom:2px solid var(--sky-soft);display:flex;align-items:center;gap:8px}
h2::before{content:'';width:5px;height:18px;background:var(--sky);border-radius:3px}
.muted{color:var(--muted);font-size:.92rem}
.hero{text-align:center;padding:14px 0 22px}
.hero h1{font-size:1.8rem}
.hero p{color:var(--muted);margin-top:6px}

/* Formulaires */
label{display:block;font-size:.82rem;font-weight:600;color:var(--navy2);margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 13px;background:#fff;color:var(--text);border:1.5px solid var(--line);border-radius:10px;font-size:.95rem;font-family:inherit;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px rgba(56,169,245,.18)}
input:disabled,select:disabled,textarea:disabled{background:#eef3f9;color:#7b8aa0;cursor:not-allowed}
textarea{min-height:110px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media(max-width:640px){.grid{grid-template-columns:1fr}header.top{padding:12px 14px}.hero h1{font-size:1.45rem}}
.hint{font-size:.8rem;color:var(--muted);margin-top:6px}

/* Choix du niveau */
.levels{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.levels{grid-template-columns:1fr}}
.level{position:relative;display:block;margin:0;cursor:pointer}
.level input{position:absolute;opacity:0;pointer-events:none}
.level .box{display:block;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;transition:.15s}
.level .box b{display:block;color:var(--navy);font-size:.98rem}
.level .box small{color:var(--muted);font-weight:500;font-size:.82rem}
.level:hover .box{border-color:var(--sky)}
.level input:checked + .box{border-color:var(--sky);background:var(--sky-soft);box-shadow:0 0 0 4px rgba(56,169,245,.15)}
.level input:focus-visible + .box{box-shadow:0 0 0 4px rgba(56,169,245,.35)}
.level input:disabled + .box{opacity:.65;cursor:not-allowed}

/* Boutons */
button,.btn{background:linear-gradient(135deg,var(--sky),#1f8fe0);color:#fff;border:0;padding:11px 20px;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
button:hover{filter:brightness(1.07);transform:translateY(-1px)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
button.ghost{background:transparent;border:1.5px solid var(--line);color:var(--navy);box-shadow:none}
button.ghost:hover{background:var(--sky-soft)}
button.full{width:100%;margin-top:22px;padding:13px}

/* Messages & badges */
.msg{padding:11px 14px;border-radius:10px;margin-top:14px;font-size:.9rem;display:none}
.msg.err{display:block;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.msg.ok{display:block;background:var(--sky-soft);color:var(--navy2);border:1px solid var(--sky-line)}
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.78rem;font-weight:700}
.b-nouveau{background:#e0f0ff;color:#1366b3}
.b-en_revue{background:#fff4d6;color:#a16207}
.b-entretien{background:#e6e0ff;color:#5b3fc9}
.b-accepte{background:#dcfce7;color:#15803d}
.b-refuse{background:#fee2e2;color:#b91c1c}

/* Suivi par ID */
.trackrow{display:flex;gap:10px;margin-top:10px}
.trackrow input{flex:1;text-transform:uppercase;letter-spacing:1px;font-weight:600}
@media(max-width:520px){.trackrow{flex-direction:column}}

/* Écran de confirmation avec l'ID */
.done{text-align:center;border-top:4px solid var(--sky)}
.done .check{width:56px;height:56px;border-radius:50%;background:#dcfce7;color:#15803d;display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 12px}
.idbox{display:inline-block;margin:18px 0 8px;padding:14px 26px;border:2px dashed var(--sky);border-radius:14px;background:var(--sky-soft);font-size:1.7rem;font-weight:800;letter-spacing:2px;color:var(--navy);user-select:all}
@media(max-width:520px){.idbox{font-size:1.25rem;padding:12px 16px}}
.done .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.warn{margin-top:16px;font-size:.85rem;color:#a16207;background:#fff8e1;border:1px solid #fde8a6;border-radius:10px;padding:10px 14px}

/* Bandeau candidature existante */
.existing{border-left:5px solid var(--sky)}
.existing .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.existing .id{font-weight:800;letter-spacing:1px;color:var(--navy)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="i18n.js"></script>
</head>
<body data-title="title.index">
<header class="top">
  <div class="logo">ASH <span>Chatting</span></div>
  <div class="head-right">
    <select class="lang-select" onchange="setLang(this.value)" aria-label="Language">
      <option value="fr">FR – Français</option>
      <option value="en">EN – English</option>
    </select>
    <button class="ghost" onclick="goTrack()" data-i18n="c.nav.track"></button>
  </div>
</header>

<div class="wrap">
  <div class="hero" id="hero">
    <h1 data-i18n="c.hero.title"></h1>
    <p data-i18n="c.hero.sub"></p>
  </div>

  <!-- Retrouver sa candidature avec l'ID -->
  <div class="card" id="trackCard">
    <h2 data-i18n="c.track.title"></h2>
    <p class="muted" data-i18n="c.track.hint"></p>
    <div class="trackrow">
      <input id="trackId" data-i18n-ph="c.track.ph" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter'){event.preventDefault();track()}">
      <button onclick="track()" data-i18n="c.track.btn"></button>
    </div>
    <div id="trackMsg" class="msg"></div>
  </div>

  <!-- Confirmation après envoi -->
  <div class="card done" id="done" hidden>
    <div class="check">✓</div>
    <h1 data-i18n="c.ok.title"></h1>
    <p class="muted" data-i18n="c.ok.text"></p>
    <div class="idbox" id="doneId"></div>
    <div class="actions">
      <button id="copyBtn" onclick="copyId()" data-i18n="c.ok.copy"></button>
      <button class="ghost" onclick="viewDone()" data-i18n="c.ok.view"></button>
    </div>
    <p class="warn" data-i18n="c.ok.warn"></p>
  </div>

  <!-- Candidature existante (retrouvée avec l'ID) -->
  <div class="card existing" id="existing" hidden>
    <div class="row">
      <div>
        <span class="muted" data-i18n="c.yourId"></span> <span class="id" id="exId"></span><br>
        <span class="muted"><span data-i18n="c.status"></span> <span id="exBadge" class="badge b-nouveau"></span></span>
      </div>
      <button class="ghost" onclick="newApplication()" data-i18n="c.new"></button>
    </div>
    <div id="exInfo" class="msg ok"></div>
  </div>

  <form id="form" class="card" onsubmit="submitForm(event)" novalidate>
    <h2 data-i18n="c.formTitle"></h2>
    <div class="grid">
      <div><label for="horodateur" data-i18n="c.horodateur"></label><input id="horodateur" disabled></div>
      <div><label for="gender" data-i18n="c.gender"></label>
        <select id="gender" required>
          <option value="" data-i18n="opt.choose"></option>
          <option value="Homme" data-i18n="v.Homme"></option>
          <option value="Femme" data-i18n="v.Femme"></option>
        </select></div>
      <div><label for="full_name" data-i18n="c.fullName"></label><input id="full_name" required maxlength="120" autocomplete="name"></div>
      <div><label for="age" data-i18n="c.age"></label><input id="age" type="number" min="18" max="70" required></div>
      <div><label for="email" data-i18n="c.email"></label><input id="email" type="email" required maxlength="160" autocomplete="email" placeholder="nom@exemple.com"></div>
      <div><label for="contact_type" data-i18n="c.contactType"></label>
        <select id="contact_type" required onchange="updateContactHint()">
          <option value="" data-i18n="opt.chooseFirst"></option>
          <option value="Messenger" data-i18n="v.Messenger"></option>
          <option value="WhatsApp" data-i18n="v.WhatsApp"></option>
        </select></div>
      <div><label for="contact_value" id="contactLabel"></label><input id="contact_value" required maxlength="160"></div>
      <div><label for="discord" data-i18n="c.discord"></label><input id="discord" required maxlength="80" placeholder="@pseudo"></div>
      <div><label for="studies" data-i18n="c.studies"></label><input id="studies" required maxlength="200"></div>
      <div><label for="current_job" data-i18n="c.job"></label>
        <select id="current_job" required>
          <option value="" data-i18n="opt.choose"></option>
          <option value="Oui" data-i18n="v.Oui"></option>
          <option value="Non" data-i18n="v.Non"></option>
        </select></div>
      <div><label for="shift" data-i18n="c.shift"></label>
        <select id="shift" required>
          <option value="" data-i18n="opt.choose"></option>
          <option value="Jour" data-i18n="v.Jour"></option>
          <option value="Soir" data-i18n="v.Soir"></option>
          <option value="Nuit" data-i18n="v.Nuit"></option>
          <option value="Flexible" data-i18n="v.Flexible"></option>
        </select></div>
      <div><label for="work_mode" data-i18n="c.workMode"></label>
        <select id="work_mode" required>
          <option value="" data-i18n="opt.choose"></option>
          <option value="Local" data-i18n="v.Local"></option>
          <option value="En ligne" data-i18n="v.En ligne"></option>
        </select></div>
    </div>

    <label data-i18n="c.level"></label>
    <div class="levels" role="radiogroup">
      <label class="level"><input type="radio" name="level" value="debutant">
        <span class="box"><b data-i18n="c.level.debutant"></b><small data-i18n="c.level.debutant.d"></small></span></label>
      <label class="level"><input type="radio" name="level" value="experimente">
        <span class="box"><b data-i18n="c.level.experimente"></b><small data-i18n="c.level.experimente.d"></small></span></label>
    </div>

    <label for="experience" data-i18n="c.experience"></label>
    <textarea id="experience" required maxlength="4000"></textarea>
    <p class="hint" data-i18n="c.experience.hint"></p>

    <label for="motivation" data-i18n="c.motivation"></label>
    <textarea id="motivation" required maxlength="4000"></textarea>

    <!-- Piège à robots : ce champ doit rester vide -->
    <div style="position:absolute;left:-9999px;top:-9999px" aria-hidden="true">
      <input id="website" tabindex="-1" autocomplete="off">
    </div>

    <button class="full" id="btn" type="submit"></button>
    <div id="msg" class="msg"></div>
  </form>
</div>

<script>
const FIELDS = ['gender','full_name','age','email','contact_type','contact_value','discord','studies','current_job','shift','work_mode','experience','motivation'];
let app = null;            // candidature retrouvée avec l'ID (null = nouvelle candidature)
let lastId = null;         // ID qui vient d'être créé
let lastMsg = null;
let lastTrack = null;
let horoDate = new Date();

const $ = id => document.getElementById(id);

// Met l'ID au bon format : "ash7k4m92qx" -> "ASH-7K4M-92QX"
function fmtId(s) {
  const c = String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (c.length === 11 && c.startsWith('ASH')) return 'ASH-' + c.slice(3, 7) + '-' + c.slice(7);
  return String(s || '').toUpperCase().trim();
}

function showMsg(elId, msg, type) {
  const el = $(elId);
  if (elId === 'msg') lastMsg = msg ? { msg, type } : null;
  if (elId === 'trackMsg') lastTrack = msg ? { msg, type } : null;
  if (!msg) { el.textContent = ''; el.className = 'msg'; return; }
  el.textContent = msg.startsWith('@') ? t(msg.slice(1)) : msg;
  el.className = 'msg ' + type;
}

function errKey(err) {
  const m = String((err && err.message) || '').trim();
  if (t('c.err.' + m) !== 'c.err.' + m) return '@c.err.' + m;
  // erreur inconnue : on garde le détail technique pour trouver la cause
  console.error('Erreur Supabase :', err);
  return t('c.err.generic') + (m ? ' (' + m + ')' : '');
}

function getLevel() {
  const r = document.querySelector('input[name=level]:checked');
  return r ? r.value : '';
}
function setLevel(v) {
  document.querySelectorAll('input[name=level]').forEach(r => { r.checked = (r.value === v); });
}

function updateContactHint() {
  const type = $('contact_type').value;
  const input = $('contact_value');
  const label = $('contactLabel');
  if (type === 'WhatsApp') { label.textContent = t('c.contactLabelWA'); input.placeholder = t('c.contactWA'); }
  else if (type === 'Messenger') { label.textContent = t('c.contactLabelMS'); input.placeholder = t('c.contactMS'); }
  else { label.textContent = t('c.contactLabel'); input.placeholder = t('c.contactNone'); }
}

function setLocked(locked) {
  FIELDS.forEach(id => { $(id).disabled = locked; });
  document.querySelectorAll('input[name=level]').forEach(r => { r.disabled = locked; });
  $('btn').hidden = locked;
}

function renderHoro() {
  $('horodateur').value = horoDate.toLocaleString(locale());
}

function renderBtn() {
  $('btn').textContent = app ? t('c.update') : t('c.submit');
}

function renderExisting() {
  if (!app) { $('existing').hidden = true; return; }
  $('existing').hidden = false;
  $('exId').textContent = app.public_id;
  $('exBadge').textContent = statut(app.status);
  $('exBadge').className = 'badge b-' + app.status;
  $('exInfo').textContent = t('ag.info.' + app.status);
  setLocked(app.status !== 'nouveau');
  renderBtn();
}

function fillForm(a) {
  FIELDS.forEach(id => { $(id).value = a[id] ?? ''; });
  setLevel(a.level || '');
  horoDate = new Date(a.created_at);
  renderHoro();
  updateContactHint();
}

function clearForm() {
  FIELDS.forEach(id => { $(id).value = ''; });
  setLevel('');
  horoDate = new Date();
  renderHoro();
  updateContactHint();
}

function collect() {
  const p = {};
  FIELDS.forEach(id => {
    let v = $(id).value.trim();
    p[id] = (id === 'age') ? (v === '' ? null : Number(v)) : v;
  });
  p.level = getLevel();
  return p;
}

// ----- Retrouver une candidature avec l'ID -----
async function loadById(rawId) {
  const id = fmtId(rawId);
  $('trackId').value = id;
  showMsg('trackMsg', null);
  if (!id) return false;
  const { data, error } = await sb.rpc('get_application', { p_id: id });
  if (error || !data) { showMsg('trackMsg', '@c.track.notfound', 'err'); return false; }
  app = data;
  $('done').hidden = true;
  $('form').hidden = false;
  fillForm(app);
  renderExisting();
  showMsg('msg', null);
  try { localStorage.setItem('ash_last_id', app.public_id); } catch (e) {}
  $('existing').scrollIntoView({ behavior: 'smooth', block: 'start' });
  return true;
}

function track() { loadById($('trackId').value); }
function goTrack() { $('trackCard').scrollIntoView({ behavior: 'smooth' }); $('trackId').focus(); }

function newApplication() {
  app = null;
  setLocked(false);
  clearForm();
  renderExisting();
  renderBtn();
  showMsg('msg', null);
  $('trackId').value = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ----- Envoi / modification -----
async function submitForm(e) {
  e.preventDefault();
  showMsg('msg', null);
  if ($('website').value) { // robot : on fait semblant que c'est bon
    showDone('ASH-' + Math.random().toString(36).slice(2, 6).toUpperCase() + '-' + Math.random().toString(36).slice(2, 6).toUpperCase());
    return;
  }
  const p = collect();
  const empty = FIELDS.some(k => p[k] === '' || p[k] === null) || !p.level;
  if (empty) { showMsg('msg', '@c.err.missing_field', 'err'); return; }

  const btn = $('btn');
  btn.disabled = true;
  try {
    if (app) {
      const { data, error } = await sb.rpc('update_application', { p_id: app.public_id, p });
      if (error) throw error;
      app = data;
      renderExisting();
      showMsg('msg', '@c.saved', 'ok');
    } else {
      const { data, error } = await sb.rpc('submit_application', { p });
      if (error) throw error;
      showDone(data.public_id);
    }
  } catch (err) {
    showMsg('msg', errKey(err), 'err');
  }
  btn.disabled = false;
}

function showDone(id) {
  lastId = id;
  try { localStorage.setItem('ash_last_id', id); } catch (e) {}
  $('doneId').textContent = id;
  $('done').hidden = false;
  $('form').hidden = true;
  $('trackCard').hidden = true;
  $('hero').hidden = true;
  $('copyBtn').textContent = t('c.ok.copy');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

async function viewDone() {
  $('trackCard').hidden = false;
  $('hero').hidden = false;
  await loadById(lastId);
}

async function copyId() {
  const id = lastId;
  let ok = false;
  try { await navigator.clipboard.writeText(id); ok = true; } catch (e) {}
  if (!ok) {
    try {
      const ta = document.createElement('textarea');
      ta.value = id; document.body.appendChild(ta); ta.select();
      ok = document.execCommand('copy'); document.body.removeChild(ta);
    } catch (e) {}
  }
  const b = $('copyBtn');
  if (ok) { b.textContent = t('c.ok.copied'); setTimeout(() => { b.textContent = t('c.ok.copy'); }, 2000); }
  else { const r = document.createRange(); r.selectNodeContents($('doneId')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
}

document.addEventListener('langchange', () => {
  updateContactHint();
  renderHoro();
  renderBtn();
  renderExisting();
  if (!$('done').hidden) $('copyBtn').textContent = t('c.ok.copy');
  if (lastMsg) showMsg('msg', lastMsg.msg, lastMsg.type);
  if (lastTrack) showMsg('trackMsg', lastTrack.msg, lastTrack.type);
});

(async function init() {
  applyI18n();
  updateContactHint();
  renderHoro();
  renderBtn();
  // lien direct : index.html?id=ASH-XXXX-XXXX
  const fromUrl = new URLSearchParams(location.search).get('id');
  let saved = '';
  try { saved = localStorage.getItem('ash_last_id') || ''; } catch (e) {}
  if (fromUrl) await loadById(fromUrl);
  else if (saved) $('trackId').value = saved;
})();
</script>
</body>
</html>
