<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>ASH Chatting – Candidature</title>
<style>
/* ASH Chatting - thème bleu marine & bleu ciel */
:root{
  --navy:#0b1f4b; --navy2:#12306b; --sky:#38a9f5; --sky-soft:#e8f4fe; --sky-line:#cfe6fa;
  --bg:#f3f7fc; --card:#ffffff; --line:#dbe5f1;
  --text:#14213d; --muted:#64748b;
  --shadow:0 4px 18px rgba(11,31,75,.07);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.55}
.wrap{max-width:1100px;margin:0 auto;padding:28px 16px}
.narrow{max-width:800px}

/* En-tête */
header.top{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:linear-gradient(90deg,var(--navy),var(--navy2));color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 12px rgba(11,31,75,.25)}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:.6px;color:#fff}
.logo span{color:var(--sky)}

/* Cartes */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;margin-bottom:20px;box-shadow:var(--shadow)}
h1{font-size:1.55rem;margin-bottom:6px;color:var(--navy)}
h2{font-size:1.05rem;margin-bottom:12px;color:var(--navy);padding-bottom:8px;border-bottom:2px solid var(--sky-soft);display:flex;align-items:center;gap:8px}
h2::before{content:'';width:5px;height:18px;background:var(--sky);border-radius:3px}
.muted{color:var(--muted);font-size:.92rem}
.center{text-align:center}

/* Formulaires */
label{display:block;font-size:.82rem;font-weight:600;color:var(--navy2);margin:14px 0 6px}
input,select,textarea{width:100%;padding:11px 13px;background:#fff;color:var(--text);border:1.5px solid var(--line);border-radius:10px;font-size:.95rem;font-family:inherit;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 4px rgba(56,169,245,.18)}
input:disabled,select:disabled,textarea:disabled{background:#eef3f9;color:#7b8aa0;cursor:not-allowed}
textarea{min-height:110px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
@media(max-width:640px){.grid{grid-template-columns:1fr}header.top{padding:12px 14px}}

/* Boutons */
button{background:linear-gradient(135deg,var(--sky),#1f8fe0);color:#fff;border:0;padding:11px 20px;border-radius:10px;font-size:.95rem;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
button:hover{filter:brightness(1.07);transform:translateY(-1px)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
button.full{width:100%;margin-top:20px;padding:13px}

/* Messages */
.msg{padding:11px 14px;border-radius:10px;margin-top:14px;font-size:.9rem;display:none}
.msg.err{display:block;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.msg.ok{display:block;background:var(--sky-soft);color:var(--navy2);border:1px solid var(--sky-line)}

/* Sélecteur de langue */
.head-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.lang-select{width:auto;padding:7px 10px;font-size:.85rem;border-radius:8px;cursor:pointer;font-weight:600;background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
.lang-select option{color:#14213d}

/* Champ piège anti-robots */
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

    'ag.contactLabelWA': 'Your WhatsApp number *',
    'ag.contactLabelMS': 'Your Messenger (profile name or link) *',
    'ph.contactNone': 'Select Messenger or WhatsApp first',
    'ph.contactWA': '+261 ...',

    'ph.jobDetails': 'E.g. position, company, hours... or the reason why you do not have a job right now',

    'ag.ageMin': 'You must be between 18 and 70 years old to apply.'
  }
};

let LANG = 'fr';
try {
  const saved = localStorage.getItem('ash_lang');
  LANG = saved || ((navigator.language || 'fr').slice(0, 2));
} catch (e) {}
if (!I18N[LANG]) LANG = 'fr';

function t(key) {
  return (I18N[LANG] && I18N[LANG][key]) ?? I18N.fr[key] ?? key;
}
function locale() { return LANG === 'fr' ? 'fr-FR' : 'en-GB'; }

function applyI18n() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('.lang-select').forEach(s => { s.value = LANG; });
  if (document.body && document.body.dataset.title) document.title = t(document.body.dataset.title);
}

function setLang(l) {
  if (!I18N[l]) return;
  LANG = l;
  try { localStorage.setItem('ash_lang', l); } catch (e) {}
  applyI18n();
  document.dispatchEvent(new Event('langchange'));
}
</script>
</head>
<body data-title="title.index">
<header class="top">
  <div class="logo">ASH <span>Chatting</span></div>
  <div class="head-right">
    <select class="lang-select" onchange="setLang(this.value)" aria-label="Language">
      <option value="fr">FR – Français</option>
      <option value="en">EN – English</option>
    </select>
  </div>
</header>

<div class="wrap narrow">
  <div class="card" id="introCard">
    <h1 data-i18n="ag.pageTitle"></h1>
    <p class="muted" data-i18n="ag.intro"></p>
  </div>

  <form id="form" class="card" onsubmit="save(event)" novalidate>
    <h2 data-i18n="ag.formTitle"></h2>
    <div class="grid">
      <div><label data-i18n="ag.horodateur"></label><input id="horodateur" disabled></div>
      <div><label data-i18n="ag.gender"></label>
        <select id="gender">
          <option value="" data-i18n="opt.choose"></option>
          <option value="Homme" data-i18n="v.Homme"></option>
          <option value="Femme" data-i18n="v.Femme"></option>
        </select></div>
      <div><label data-i18n="ag.fullName"></label><input id="full_name" maxlength="200"></div>
      <div><label data-i18n="ag.age"></label><input id="age" type="number" min="18" max="70" inputmode="numeric"></div>
      <div><label data-i18n="ag.contactType"></label>
        <select id="contact_type" onchange="updateContactHint()">
          <option value="" data-i18n="opt.chooseFirst"></option>
          <option value="Messenger" data-i18n="v.Messenger"></option>
          <option value="WhatsApp" data-i18n="v.WhatsApp"></option>
        </select></div>
      <div><label id="contactLabel"></label><input id="contact_value" maxlength="200"></div>
      <div><label data-i18n="ag.discord"></label><input id="discord" maxlength="200" placeholder="@pseudo"></div>
      <div><label data-i18n="ag.studies"></label><input id="studies" maxlength="500"></div>
    </div>

    <label data-i18n="ag.job"></label>
    <select id="current_job">
      <option value="" data-i18n="opt.choose"></option>
      <option value="Oui" data-i18n="v.Oui"></option>
      <option value="Non" data-i18n="v.Non"></option>
    </select>
    <label data-i18n="ag.experience"></label>
    <textarea id="experience" maxlength="4000" data-i18n-ph="ph.experience"></textarea>

    <div class="grid">
      <div><label data-i18n="ag.shift"></label>
        <select id="shift">
          <option value="" data-i18n="opt.choose"></option>
          <option value="Jour" data-i18n="v.Jour"></option>
          <option value="Soir" data-i18n="v.Soir"></option>
          <option value="Nuit" data-i18n="v.Nuit"></option>
          <option value="Flexible" data-i18n="v.Flexible"></option>
        </select></div>
      <div><label data-i18n="ag.workMode"></label>
        <select id="work_mode">
          <option value="" data-i18n="opt.choose"></option>
          <option value="Local" data-i18n="v.Local"></option>
          <option value="En ligne" data-i18n="v.En ligne"></option>
        </select></div>
    </div>

    <label data-i18n="ag.motivation"></label>
    <textarea id="motivation" maxlength="4000"></textarea>

    <!-- Champ piège anti-robots : doit rester vide -->
    <input id="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

    <button type="submit" class="full" id="btn" data-i18n="ag.submit"></button>
    <div id="msg" class="msg"></div>
  </form>

  <div id="successCard" class="card center" style="display:none;padding:40px 26px">
    <h1>✅ <span data-i18n="ag.success.title"></span></h1>
    <p class="muted" style="margin-top:10px;font-size:1rem" data-i18n="ag.success.text"></p>
  </div>
</div>

<script>
const opened = new Date(); // horodateur : moment où le candidat ouvre la page
let sending = false;       // empêche le double envoi
let lastMsg = null;        // pour retraduire le message si la langue change

const FIELDS = ['gender','full_name','age','contact_type','contact_value','discord','studies','current_job','experience','shift','work_mode','motivation'];
const REQUIRED = FIELDS.filter(f => f !== 'job_details');

function showMsg(key, type, raw) {
  const el = document.getElementById('msg');
  if (!key) { lastMsg = null; el.textContent = ''; el.className = 'msg'; return; }
  lastMsg = { key, type, raw };
  el.textContent = t(key) + (raw ? ' (' + raw + ')' : '');
  el.className = 'msg ' + type;
}

function updateContactHint() {
  const type = document.getElementById('contact_type').value;
  const input = document.getElementById('contact_value');
  const label = document.getElementById('contactLabel');
  if (type === 'WhatsApp') {
    label.textContent = t('ag.contactLabelWA');
    input.placeholder = t('ph.contactWA');
  } else if (type === 'Messenger') {
    label.textContent = t('ag.contactLabelMS');
    input.placeholder = t('ph.contactMS');
  } else {
    label.textContent = t('ag.contactLabel');
    input.placeholder = t('ph.contactNone');
  }
}

function renderHoro() {
  document.getElementById('horodateur').value = opened.toLocaleString(locale());
}

function showSuccess() {
  document.getElementById('form').style.display = 'none';
  document.getElementById('introCard').style.display = 'none';
  document.getElementById('successCard').style.display = 'block';
  window.scrollTo(0, 0);
}

async function save(e) {
  e.preventDefault();
  if (sending) return;

  // Robot détecté (champ piège rempli) : on fait semblant que tout va bien
  if (document.getElementById('website').value) { showSuccess(); return; }

  if (typeof sb === 'undefined' || !sb) { showMsg('err.noConfig', 'err'); return; }

  const payload = {};
  FIELDS.forEach(id => {
    let v = document.getElementById(id).value.trim();
    if (id === 'age') v = v === '' ? null : Number(v);
    else if (v === '') v = null;
    payload[id] = v;
  });

  if (REQUIRED.some(id => payload[id] === null || Number.isNaN(payload[id]))) {
    showMsg('ag.fillAll', 'err');
    return;
  }
  if (!Number.isInteger(payload.age) || payload.age < 18 || payload.age > 70) {
    showMsg('ag.ageMin', 'err');
    return;
  }

  const btn = document.getElementById('btn');
  sending = true;
  btn.disabled = true;
  showMsg(null);
  try {
    const { error } = await sb.from('applications').insert(payload);
    if (error) throw error;
    showSuccess();
  } catch (err) {
    showMsg('ag.sendError', 'err', err && err.message ? err.message : '');
    btn.disabled = false;
    sending = false;
  }
}

document.addEventListener('langchange', () => {
  updateContactHint();
  renderHoro();
  if (lastMsg) showMsg(lastMsg.key, lastMsg.type, lastMsg.raw);
});

applyI18n();
updateContactHint();
renderHoro();
if (typeof sb === 'undefined' || !sb) showMsg('err.noConfig', 'err');
</script>
</body>
</html>
